name: CI

on:
  push:
    branches: [main]
    paths-ignore: &non-build
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'prometheus.yml'
      - 'scripts/**'
      - '.gitmessage'
  pull_request:
    branches: [main]
    paths-ignore: *non-build

# A new push to a PR cancels the run still going for the previous one.
# Never cancel on main -- every commit there gets a real result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just fmt-check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just clippy

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - run: just test
      - run: just doc
