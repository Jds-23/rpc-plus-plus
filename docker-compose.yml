services:
  proxy:
    build: .
    image: rpc-plus-plus
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./settings.yaml:/app/settings.yaml:ro
    env_file:
      - path: .env
        required: false
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      RPC_CONFIG_PATH: /app/settings.yaml
    stop_grace_period: 10s
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - 9090:9090
  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      # Read-only without a login; admin/admin still signs in to edit.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rpc-plus-plus.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

networks:
  default:
    name: prometheus-grafana
    driver: bridge
volumes:
  prometheus_data:
  grafana_data: