# Copy to settings.yaml and fill in real upstreams. settings.yaml is gitignored
# because provider URLs carry the API key in the path.

application:
  port: 8080

  # Optional, shown with their defaults.
  # host: only widen past loopback inside a container. There is no auth yet, so a
  # reachable proxy is an open relay spending your upstream API keys.
  host: 0.0.0.0
  proxy:
    max_attempt: 3
    retry_after_in_secs: 1
    rpc_timeout_in_secs: 3

upstreams:
  - label: alchemy
    url: https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}
  - label: drpc
    url: https://eth.drpc.org
  - label: blockrazor
    url: https://eth.blockrazor.xyz

# Optional, shown with its default.
decider: ROUND_ROBIN
